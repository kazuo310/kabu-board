name: daily-stock-board

on:
  schedule:
    - cron: "0 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 日本語フォントを入れる（グラフの文字化け防止）
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Python を用意
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ライブラリをインストール
        run: pip install -r requirements.txt

      - name: 株価を取得（data/ に追記）
        run: python scripts/fetch.py

      - name: グラフを生成（docs/ に出力）
        run: python scripts/build.py

      - name: 変更をコミットして反映
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --staged --quiet; then
            echo "変更なし（休場日など）。コミットをスキップします。"
          else
            git commit -m "update: $(date -u +%Y-%m-%d) の株価とグラフ"
            git push
          fi
